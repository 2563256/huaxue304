# A longer, statistically-flavoured scenario for the metrics report, on the
# scanned office map (geomap_colour_noroof).
#
# 20 tasks with a spread of payloads, priorities and deadlines across all three
# zone pairs. The point is to produce enough completed tasks that the summary
# numbers (mean completion time, makespan, utilisation, energy per robot)
# actually mean something, and to make the light/heavy split visible:
# roughly half the tasks are light-only, a third are heavy-only, and the rest
# are open to whoever the cost function prefers.
#
# The six pickup/dropoff pads alternate around the EASTERN half of the ring -
# west to east along the +4.2 m arm, then back west along the south corridor -
# and are deliberately spread out rather than paired: consecutive pads are
# 1.9-3.7 m apart. Nothing sits in the east connector, which is the ring's only
# north-south link at that end: working there closes the corridor and every
# crossing turns into a head-on standoff. They are also clear of the fleet's
# status labels, since a label drawn over a task point hides it in RViz. They
# are the same markers the world draws (make_geomap_world.py ZONES) and
# tools/verify_scene.py checks:
#
#   pickup   A(10.60,-0.43)  B(  1.70,  4.22)  C(  9.10,  4.22)
#   dropoff  A( 8.10,-0.43)  B(  5.40,  4.22)  C( 11.00,  4.22)
#
# The 20 tasks use every pickup->dropoff combination; trips run 1.9 - 9.3 m
# (mean 5.1 m). Between two tasks a robot also drives back to its charger in
# the WEST arm, so the real deadhead is dominated by that trip, not by these.
# See RUNBOOK.md 4.5.

tasks:
  - {id: t01, type: transport, pickup: [10.60, -0.43, 0.0], dropoff: [ 8.10, -0.43, 0.0],   payload_kg: 7.0,   required_capability: light_payload, priority: 2, deadline_sec: 300.0}
