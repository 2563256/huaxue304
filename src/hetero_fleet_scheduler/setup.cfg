# ament_python install layout.
#
# Without this file setuptools installs the console_scripts entry points into
# <prefix>/bin/, but `ros2 run` and `ros2 launch` look for them in
# <prefix>/lib/<package_name>/. The package still resolves (so `ros2 pkg list`
# shows it), but resolving the executable fails with:
#
#   package 'hetero_fleet_scheduler' found at '...' but libexec directory
#   '.../lib/hetero_fleet_scheduler' does not exist
#
# That error is fatal inside a launch file, which then tears the whole launch
# down - taking Gazebo and RViz with it, which looks like they "crashed".
#
# This is the same mechanism the stock ROS 2 ament_python packages use (e.g.
# nav2_amcl installs to lib/nav2_amcl/amcl).
[develop]
script_dir=$base/lib/hetero_fleet_scheduler
[install]
install_scripts=$base/lib/hetero_fleet_scheduler
