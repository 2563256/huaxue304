# ros_gz_bridge topic mapping for the whole fleet.
#
# Each robot is bridged in its own namespace, so the ROS side sees
# /light_1/scan, /heavy_1/odom, /omni_1/scan and so on while Gazebo publishes the same data
# under /light_1/scan (the sensor <topic> in the URDF already carries the
# namespace, so no renaming is needed for sensors).
#
# Direction:
#   GZ_TO_ROS  sensor + state data flowing up into ROS
#   ROS_TO_GZ  velocity commands flowing down into the controllers
#
# NOTE: cmd_vel is intentionally NOT bridged to the *controllers*. Nav2 writes
# to /<ns>/cmd_vel, which gz_ros2_control subscribes to directly. Bridging it
# into Gazebo too would create a second, competing velocity source that bypasses
# the controller's limits and odometry.
#
# This file holds the FLEET-WIDE bridges only. The per-robot ones (scan,
# gz_pose, gz_odom) are generated from robot_profiles.yaml by bridge.launch.py,
# because hand-writing them is how light_2 ended up with no lidar at all: the
# list was written when the fleet had three robots and was never extended. See
# render_bridge_config() in that launch file for the full story.

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /gz/dynamic_pose
  gz_topic_name: /world/geomap_fleet/dynamic_pose/info
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
