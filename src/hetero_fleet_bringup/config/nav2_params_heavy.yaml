# Scene update 2026-10-10: measured 2x footprint; inflation remains outside padded inscribed radius.
# Nav2 parameters for the HEAVY differential AMR (0.428 x 0.322 m, 0.45 m/s).
#
# All three robot types share this file's structure; what differs is:
#   - inflation_radius / cost_scaling_factor  (how much clearance it keeps)
#   - max_vel_x / max_vel_theta               (how fast it is allowed to go)
#   - whether lateral motion is allowed       (diff cannot strafe)
#
# Rescaled for the scanned office map: the fleet is 0.36-0.49x the warehouse
# size so that every type fits the ring corridor of maps/geomap.pgm. The heavy
# AMR is the widest (0.428 x 0.322 vs 0.403 x 0.317 for the light one) and
# therefore reserves the most length clearance: 0.161 + 0.20 = 0.361 m; the
# omni reserves the most overall at 0.176 + 0.21 = 0.386 m. See MAP_SWAP.md
# for the measurements and robot_profiles.yaml for where the footprint comes
# from (it is the true collision outline, wheels included).
#
# The launch file rewrites <robot_name> to the concrete instance.

# AMCL runs one filter per robot against the shared map. The frame ids MUST be
# namespaced: the TF tree contains <robot_name>/odom and
# <robot_name>/base_footprint, never bare odom / base_footprint. With the bare
# defaults the message filter cannot transform a single scan, drops every one
# of them with "discarding message because the queue is full", and
# /<robot_name>/amcl_pose stays empty forever.
# tf_broadcast stays false: map -> odom is owned by bridge.launch.py, and the
# ground-truth odom relay owns odom -> base_footprint.
amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: <robot_name>/odom
    base_frame_id: <robot_name>/base_footprint
    scan_topic: scan          # remapped to /<robot_name>/scan_fixed by nav2.launch.py
    tf_broadcast: false

bt_navigator:
  ros__parameters:
    use_sim_time: true
    default_nav_to_pose_bt_xml: <bringup_share>/config/fleet_navigation.xml
    global_frame: map
    robot_base_frame: <robot_name>/base_footprint
    odom_topic: /<robot_name>/odom
    bt_loop_duration: 10
    # Raised from the Nav2 default of 20 ms; see the note in
    # nav2_params_light.yaml - under this machine's load the ACK can miss the
    # default window and abort the goal.
    plugin_lib_names: ["hetero_stable_route_bt"]
    default_server_timeout: 2000

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # See the note in nav2_params_light.yaml: a collision-monitor stop must
      # not be mistaken for a stuck robot.
      required_movement_radius: 0.2
      movement_time_allowance: 30.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.0            # differential drive: no lateral motion
      wz_std: 0.4
      vx_max: 0.45           # heavy AMR top speed (see robot_profiles.yaml)
      vx_min: -0.20
      vy_max: 0.0
      wz_max: 0.8
      iteration_count: 1
      prune_distance: 1.2
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        # Check the full current body, including corners, against moving robots.
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.05
        near_goal_distance: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: <robot_name>/odom
      robot_base_frame: <robot_name>/base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Rectangular footprint instead of a circumscribed circle; see the long
      # note in nav2_params_omni.yaml. The polygon's inscribed radius is the
      # 0.161 m half-width, so a legal stance next to furniture is not reported
      # as a lethal cell for the robot's own centre.
      footprint: "[[0.4278, 0.3224], [0.4278, -0.3224], [-0.4278, -0.3224], [-0.4278, 0.3224]]"
      # 3 cm of padding on top of the true outline. Without it the costmap's
      # lethal radius equals the physical contact distance, so a robot that
      # brushes a wall sits inside its own lethal cell and MPPI finds no
      # feasible rollout ("Optimizer fail to compute path") - measured as 42
      # failures and a wedged fleet in one run. The padding is what restores
      # the margin the old undersized footprint was accidentally providing.
      footprint_padding: 0.03
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "robot_obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /<robot_name>/scan_fixed
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
        # Other vehicles, synthesised - local costmap only, see the note in
        # nav2_params_light.yaml.
      robot_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        combination_method: 1
        observation_sources: robot_obstacles
        robot_obstacles:
          topic: /<robot_name>/robot_obstacles
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          inf_is_valid: true
          observation_persistence: 0.0
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.5
        inflation_radius: 0.60
      always_reset_initial_costmap: false
      # Local rolling window: unobserved cells are free (see the note in
      # nav2_params_light.yaml - MPPI treats NO_INFORMATION as an obstacle, so
      # track_unknown_space: true makes the robot refuse to move into space its
      # lidar has not swept yet). The global costmap below keeps it true.
      track_unknown_space: false
      transform_tolerance: 0.5

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      always_send_full_costmap: true
      global_frame: map
      robot_base_frame: <robot_name>/base_footprint
      footprint: "[[0.4278, 0.3224], [0.4278, -0.3224], [-0.4278, -0.3224], [-0.4278, 0.3224]]"
      # 3 cm of padding on top of the true outline. Without it the costmap's
      # lethal radius equals the physical contact distance, so a robot that
      # brushes a wall sits inside its own lethal cell and MPPI finds no
      # feasible rollout ("Optimizer fail to compute path") - measured as 42
      # failures and a wedged fleet in one run. The padding is what restores
      # the margin the old undersized footprint was accidentally providing.
      footprint_padding: 0.03
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "robot_obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /<robot_name>/scan_fixed
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      robot_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        combination_method: 1
        observation_sources: robot_obstacles
        robot_obstacles:
          topic: /<robot_name>/robot_obstacles
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          inf_is_valid: true
          observation_persistence: 0.0
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.5
        inflation_radius: 0.60
      transform_tolerance: 0.5

planner_server:
  ros__parameters:
    use_sim_time: true
    # Expected computation cadence only; the BT controls replanning triggers.
    expected_planner_frequency: 0.5
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.125
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: <robot_name>/odom
    global_frame: map
    robot_base_frame: <robot_name>/base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.2

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.45, 0.0, 0.8]    # [vx, vy, wz] - no lateral for diff drive
    min_velocity: [-0.20, 0.0, -0.8]
    max_accel: [0.5, 0.0, 1.2]
    max_decel: [-0.5, 0.0, -1.2]
    odom_topic: /<robot_name>/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# No proximity slowdown. Emergency contact stop remains authoritative.
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: <robot_name>/base_footprint
    odom_frame_id: <robot_name>/odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 2.0
    polygons:
    - PolygonStop
    PolygonStop:
      type: velocity_polygon
      action_type: stop
      min_points: 2
      visualize: true
      polygon_pub_topic: polygon_stop
      holonomic: false
      velocity_polygons:
      - forward
      - reverse
      - turning
      forward:
        points: '[[0.5478, 0.3724], [0.5478, -0.3724], [0, -0.3724], [0, 0.3724]]'
        linear_min: 0.02
        linear_max: 2.0
        theta_min: -0.1
        theta_max: 0.1
      reverse:
        points: '[[0, 0.3724], [0, -0.3724], [-0.5478, -0.3724], [-0.5478, 0.3724]]'
        linear_min: -2.0
        linear_max: -0.02
        theta_min: -0.1
        theta_max: 0.1
      turning:
        points: '[[0.4578, 0.3524], [0.4578, -0.3524], [-0.4578, -0.3524], [-0.4578,
          0.3524]]'
        linear_min: -2.0
        linear_max: 2.0
        theta_min: -100.0
        theta_max: 100.0
    observation_sources:
    - robot_obstacles
    robot_obstacles:
      type: scan
      topic: /<robot_name>/robot_contact
