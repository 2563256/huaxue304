# State Lattice navigation, enlarged fleet (2026-10-14).
# Physical footprint 1.2857139 x 1.125 m; global/local/swept geometry match.
# Control sets: 0.05 m, 64 headings, 0.50 m curve radius, with rotations.
# MPPI follows path orientations; the omni model also permits lateral moves.
# Inflation is a soft cost field outside the actual padded rectangular body.
# The launch file resolves <robot_name>/<bringup_share> and validates the lattice.

# AMCL runs one filter per robot against the shared map. The frame ids MUST be
# namespaced: the TF tree contains <robot_name>/odom and
# <robot_name>/base_footprint, never bare odom / base_footprint. With the bare
# defaults the message filter cannot transform a single scan, drops every one
# of them with "discarding message because the queue is full", and
# /<robot_name>/amcl_pose stays empty forever.
# tf_broadcast stays false: map -> odom is owned by bridge.launch.py, and the
# ground-truth odom relay owns odom -> base_footprint.
amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: <robot_name>/odom
    base_frame_id: <robot_name>/base_footprint
    scan_topic: scan          # remapped to /<robot_name>/scan_fixed by nav2.launch.py
    tf_broadcast: false

bt_navigator:
  ros__parameters:
    use_sim_time: true
    default_nav_to_pose_bt_xml: <bringup_share>/config/fleet_navigation.xml
    global_frame: map
    robot_base_frame: <robot_name>/base_footprint
    odom_topic: /<robot_name>/odom
    bt_loop_duration: 10
    # Raised from the Nav2 default of 20 ms; see the note in
    # nav2_params_light.yaml - under this machine's load the ACK can miss the
    # default window and abort the goal.
    plugin_lib_names: ["hetero_stable_route_bt"]
    default_server_timeout: 2000

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker", "task_goal_checker"]
    controller_plugins: ["FollowPath", "TaskFollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Local recovery starts after 15 s of no motion. The outer scheduler
      # watchdog waits 45 s of simulation time before intervening.
      required_movement_radius: 0.2
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    task_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.141593

    FollowPath: &path_controller
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.20
      vy_std: 0.20
      wz_std: 0.35
      vx_max: 0.55           # omni AMR top speed (see robot_profiles.yaml)
      vx_min: -0.25
      vy_max: 0.40
      wz_max: 1.2
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      # Chassis-fixed X roller contact constraints now reproduce lateral motion.
      # Prediction limits match the final velocity smoother.
      motion_model: "Omni"
      ax_max: 0.5
      ax_min: -0.7
      ay_max: 0.5
      ay_min: -0.7
      az_max: 1.4
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 1.4
      GoalAngleCritic: &goal_angle
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      # Holonomic motion must not be penalized for sideways or reverse travel.
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 0.75
        critical_weight: 10.0
        # Check the full current body, including corners, against moving robots.
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.12
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 16.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.15
        offset_from_furthest: 4
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        offset_from_furthest: 15
        # Keep directional progress active through the final metre.
        threshold_to_consider: 0.5
      # Footprint collision checking handles orientation clearance; do not
      # force a full body turn at every path bend on an omni chassis.
      PathAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 2

    TaskFollowPath:
      <<: *path_controller
      GoalAngleCritic:
        <<: *goal_angle
        enabled: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: <robot_name>/odom
      robot_base_frame: <robot_name>/base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Real rectangle, NOT the circumscribed circle. With robot_radius 0.52
      # A robot_radius of 0.40 m would be read as the *inscribed* radius, so
      # every cell within 0.40 m of a shelf would be scored lethal-to-the-
      # centre even though the base can physically stand closer. The polygon's
      # inscribed radius is the true 0.625 m half-width, so a stance the robot
      # can legally reach is never reported as occupied.
      footprint: '[[0.64285695, 0.5625], [0.64285695, -0.5625], [-0.64285695, -0.5625], [-0.64285695, 0.5625]]'
      # 3 cm of padding on top of the true outline. Without it the costmap's
      # lethal radius equals the physical contact distance, so a robot that
      # brushes a wall sits inside its own lethal cell and MPPI finds no
      # feasible rollout ("Optimizer fail to compute path") - measured as 42
      # failures and a wedged fleet in one run. The padding is what restores
      # the margin the old undersized footprint was accidentally providing.
      footprint_padding: 0.02
      # light sets this on its local costmap and heavy on its global one;
      # without it the costmap only pushes updates to existing subscribers and
      # RViz shows "No map received" for this robot.
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "robot_obstacle_layer", "inflation_layer"]
      # Keep mapped walls visible to MPPI even without a physical lidar return.
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /<robot_name>/map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        footprint_clearing_enabled: false
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /<robot_name>/scan_fixed
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
        # Other vehicles, synthesised - local costmap only, see the note in
        # nav2_params_light.yaml.
      robot_obstacle_layer:
        plugin: "hetero_fleet_navigation::SnapshotObstacleLayer"
        enabled: true
        combination_method: 1
        observation_sources: robot_obstacles
        robot_obstacles:
          topic: /<robot_name>/robot_planning_points
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          inf_is_valid: true
          observation_persistence: 0.0
          data_type: "PointCloud2"
          raytrace_max_range: 50.0
          raytrace_min_range: 0.0
          obstacle_max_range: 50.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 1.20
      always_reset_initial_costmap: false
      # Local rolling window: unobserved cells are free (see the note in
      # nav2_params_light.yaml - MPPI treats NO_INFORMATION as an obstacle, so
      # track_unknown_space: true makes the robot refuse to move into space its
      # lidar has not swept yet). The global costmap below keeps it true.
      track_unknown_space: false
      transform_tolerance: 0.5

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: <robot_name>/base_footprint
      # See the note on the local costmap: a rectangular footprint keeps the
      # inscribed radius at the true 0.625 m half-width, so the robot cannot
      # be stranded in a cell it is told it cannot occupy.
      footprint: '[[0.64285695, 0.5625], [0.64285695, -0.5625], [-0.64285695, -0.5625], [-0.64285695, 0.5625]]'
      # Same physical body as the local costmap and State Lattice sweep.
      # Local control uses this vehicle\'s measured body and smaller padding.
      footprint_padding: 0.02 # Match the physical swept body.
      always_send_full_costmap: true
      resolution: 0.05
      track_unknown_space: true
      # The static map describes the scene; exact teammate bodies (including
      # moving robots) enter global planning. The BT reuses a valid path
      # and replans when an obstacle invalidates it.
      plugins: ["static_layer", "robot_obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /<robot_name>/scan_fixed
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      robot_obstacle_layer:
        plugin: "hetero_fleet_navigation::SnapshotObstacleLayer"
        enabled: true
        combination_method: 1
        observation_sources: robot_obstacles
        robot_obstacles:
          topic: /<robot_name>/robot_planning_points
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          inf_is_valid: true
          observation_persistence: 0.0
          data_type: "PointCloud2"
          raytrace_max_range: 50.0
          raytrace_min_range: 0.0
          obstacle_max_range: 50.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.5
        inflation_radius: 1.20
      transform_tolerance: 0.5

planner_server:
  ros__parameters:
    use_sim_time: true
    # Expected computation cadence only; the BT controls replanning triggers.
    expected_planner_frequency: 0.5
    planner_plugins: ["GridBased", "TaskGridBased", "RetreatGridBased"]
    GridBased: &spatial_planner
      plugin: hetero_fleet_navigation::SweptLattice
      lattice_filepath: <bringup_share>/config/lattice/omni_64.json
      allow_reverse_expansion: false
      swept_footprint: '[[0.64285695, 0.5625], [0.64285695, -0.5625], [-0.64285695, -0.5625], [-0.64285695, 0.5625]]'
      swept_footprint_padding: 0.02
      rotation_penalty: 2.0
      heuristic_weight: 1.5
      tolerance: 0.05
      allow_unknown: false
      max_iterations: 1000000
      max_planning_time: 8.0
      reverse_penalty: 2.0
      cost_penalty: 2.0

    TaskGridBased:
      <<: *spatial_planner
      match_goal_heading: false
    RetreatGridBased:
      <<: *spatial_planner
      match_goal_heading: true
      reverse_penalty: 1.0


smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: <robot_name>/odom
    global_frame: map
    robot_base_frame: <robot_name>/base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.4

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.55, 0.40, 1.2]   # [vx, vy, wz] - lateral enabled
    min_velocity: [-0.55, -0.40, -1.2]
    max_accel: [0.5, 0.5, 1.4]
    max_decel: [-0.7, -0.7, -1.4]
    odom_topic: /<robot_name>/odom
    odom_duration: 0.2
    # MPPI may need millimetre-scale translation/yaw corrections at a corner.
    # Preserve these requests; task_hold and the watchdog still issue exact zero.
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# No proximity slowdown. Emergency contact stop remains authoritative.
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: <robot_name>/base_footprint
    odom_frame_id: <robot_name>/odom
    cmd_vel_in_topic: cmd_vel_reserved
    cmd_vel_out_topic: cmd_vel
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 2.0
    polygons:
    - PolygonStop
    PolygonStop:
      type: velocity_polygon
      action_type: stop
      min_points: 2
      visualize: true
      polygon_pub_topic: polygon_stop
      holonomic: true
      velocity_polygons:
      - forward
      - reverse_left
      - reverse_right
      - left
      - right
      - turning
      forward:
        points: '[[0.7628574, 0.6125], [0.7628574, -0.6125], [0.0, -0.6125], [0.0, 0.6125]]'
        linear_min: 0.02
        linear_max: 2.0
        theta_min: -0.1
        theta_max: 0.1
        direction_start_angle: -0.7853981633974483
        direction_end_angle: 0.7853981633974483
      reverse_left:
        points: '[[0.0, 0.6125], [0.0, -0.6125], [-0.7628574, -0.6125], [-0.7628574, 0.6125]]'
        linear_min: 0.02
        linear_max: 2.0
        theta_min: -0.1
        theta_max: 0.1
        direction_start_angle: 2.356194490192345
        direction_end_angle: 3.141592653589793
      reverse_right:
        points: '[[0.0, 0.6125], [0.0, -0.6125], [-0.7628574, -0.6125], [-0.7628574, 0.6125]]'
        linear_min: 0.02
        linear_max: 2.0
        theta_min: -0.1
        theta_max: 0.1
        direction_start_angle: -3.141592653589793
        direction_end_angle: -2.356194490192345
      left:
        points: '[[0.6928564, 0.6825], [0.6928564, 0.0], [-0.6928564, 0.0], [-0.6928564, 0.6825]]'
        linear_min: 0.02
        linear_max: 2.0
        theta_min: -0.1
        theta_max: 0.1
        direction_start_angle: 0.7853981633974483
        direction_end_angle: 2.356194490192345
      right:
        points: '[[0.6928564, 0.0], [0.6928564, -0.6825], [-0.6928564, -0.6825], [-0.6928564, 0.0]]'
        linear_min: 0.02
        linear_max: 2.0
        theta_min: -0.1
        theta_max: 0.1
        direction_start_angle: -2.356194490192345
        direction_end_angle: -0.7853981633974483
      turning:
        points: '[[0.6728564, 0.5925], [0.6728564, -0.5925], [-0.6728564, -0.5925], [-0.6728564, 0.5925]]'
        linear_min: 0.0
        linear_max: 2.0
        theta_min: -100.0
        theta_max: 100.0
    observation_sources:
    - robot_obstacles
    robot_obstacles:
      type: scan
      topic: /<robot_name>/robot_contact
