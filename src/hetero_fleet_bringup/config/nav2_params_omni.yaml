# Nav2 parameters for the OMNI mecanum AMR (0.403 x 0.353 m, 0.55 m/s).
#
# All three robot types share this file's structure; what differs is:
#   - inflation_radius / cost_scaling_factor  (how much clearance it keeps)
#   - max_vel_x / max_vel_theta               (how fast it is allowed to go)
#   - whether lateral motion is allowed       (this one CAN strafe)
#
# Clearance is (inscribed radius) + (inflation radius). This robot is the
# widest in the fleet (0.403 x 0.353 m, wheels included), so it sets the bar
# for the whole map: 0.176 + 0.21 = 0.386 m, against the heavy AMR's 0.361 m
# and the light AMR's 0.305 m. All three still fit the scanned office ring
# corridor (see MAP_SWAP.md); what makes this robot special on this map is
# that it can strafe, which the differential pair cannot.
#
# The launch file rewrites <robot_name> to the concrete instance.

# AMCL runs one filter per robot against the shared map. The frame ids MUST be
# namespaced: the TF tree contains <robot_name>/odom and
# <robot_name>/base_footprint, never bare odom / base_footprint. With the bare
# defaults the message filter cannot transform a single scan, drops every one
# of them with "discarding message because the queue is full", and
# /<robot_name>/amcl_pose stays empty forever.
# tf_broadcast stays false: map -> odom is owned by bridge.launch.py, and the
# ground-truth odom relay owns odom -> base_footprint.
amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: <robot_name>/odom
    base_frame_id: <robot_name>/base_footprint
    scan_topic: scan          # remapped to /<robot_name>/scan_fixed by nav2.launch.py
    tf_broadcast: false

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: <robot_name>/base_footprint
    odom_topic: /<robot_name>/odom
    bt_loop_duration: 10
    # Raised from the Nav2 default of 20 ms; see the note in
    # nav2_params_light.yaml - under this machine's load the ACK can miss the
    # default window and abort the goal.
    default_server_timeout: 300

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # See the note in nav2_params_light.yaml: a collision-monitor stop must
      # not be mistaken for a stuck robot.
      required_movement_radius: 0.2
      movement_time_allowance: 30.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2            # unused while motion_model is "DiffDrive"
      wz_std: 0.4
      vx_max: 0.55           # omni AMR top speed (see robot_profiles.yaml)
      vx_min: -0.25
      vy_max: 0.55
      wz_max: 1.2
      iteration_count: 1
      prune_distance: 1.2
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      # "Diff" even though the hardware is mecanum, because that is what this
      # simulated base can actually execute. Measured straight to the
      # controller's reference topic on a single clean Gazebo instance:
      # forward speed tracks to ~100% and yaw rate to ~94%, but a pure strafe
      # only delivers ~40%. An "Omni" roll-out therefore predicts lateral
      # motion the plant never produces, MPPI keeps re-issuing corrections
      # that do not land, and the robot snakes: with "Omni" a 1.3 m move took
      # 4.2 m of travel (wind-up 3.3x) and the goal still ended ABORTED.
      #
      # "Diff" still allows in-place rotation, so tight turns are unaffected.
      # The mecanum wheels, the omnidirectional / precise_docking capability
      # flags and the cmd_vel_stamper lateral mapping all stay as they are, so
      # a docking routine that commands linear.y explicitly still strafes.
      motion_model: "DiffDrive"
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        # FALSE, for the same reason as heavy_1: this robot is 0.403 x 0.353 m
        # and the ring corridor is ~1.2-2.5 m wide, so a full-footprint rollout
        # check leaves MPPI with no feasible trajectory and it falls back to
        # zero velocity ("Optimizer fail to compute path"). With false, MPPI
        # checks a circle of the inscribed radius (0.176 m) against the
        # costmap, and the inflation layer (0.21 >= 0.176) is what keeps that
        # circle off the lethal cells. Planning still uses the true rectangle:
        # nav2_smac_planner does non-circular footprint collision checking, so
        # the path the controller follows never requires clipping a corner.
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.05
        near_goal_distance: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: <robot_name>/odom
      robot_base_frame: <robot_name>/base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Real rectangle, NOT the circumscribed circle. With robot_radius 0.52
      # A robot_radius of 0.40 m would be read as the *inscribed* radius, so
      # every cell within 0.40 m of a shelf would be scored lethal-to-the-
      # centre even though the base can physically stand closer. The polygon's
      # inscribed radius is the true 0.176 m half-width, so a stance the robot
      # can legally reach is never reported as occupied.
      footprint: "[[0.202, 0.176], [0.202, -0.176], [-0.202, -0.176], [-0.202, 0.176]]"
      # 3 cm of padding on top of the true outline. Without it the costmap's
      # lethal radius equals the physical contact distance, so a robot that
      # brushes a wall sits inside its own lethal cell and MPPI finds no
      # feasible rollout ("Optimizer fail to compute path") - measured as 42
      # failures and a wedged fleet in one run. The padding is what restores
      # the margin the old undersized footprint was accidentally providing.
      footprint_padding: 0.02
      # light sets this on its local costmap and heavy on its global one;
      # without it the costmap only pushes updates to existing subscribers and
      # RViz shows "No map received" for this robot.
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan robot_obstacles
        scan:
          topic: /<robot_name>/scan_fixed
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
        # Other vehicles, synthesised - local costmap only, see the note in
        # nav2_params_light.yaml.
        robot_obstacles:
          topic: /<robot_name>/robot_obstacles
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.35
      always_reset_initial_costmap: false
      # Local rolling window: unobserved cells are free (see the note in
      # nav2_params_light.yaml - MPPI treats NO_INFORMATION as an obstacle, so
      # track_unknown_space: true makes the robot refuse to move into space its
      # lidar has not swept yet). The global costmap below keeps it true.
      track_unknown_space: false
      transform_tolerance: 0.5

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: <robot_name>/base_footprint
      # See the note on the local costmap: a rectangular footprint keeps the
      # inscribed radius at the true 0.176 m half-width, so the robot cannot
      # be stranded in a cell it is told it cannot occupy.
      footprint: "[[0.202, 0.176], [0.202, -0.176], [-0.202, -0.176], [-0.202, 0.176]]"
      # 3 cm of padding on top of the true outline. Without it the costmap's
      # lethal radius equals the physical contact distance, so a robot that
      # brushes a wall sits inside its own lethal cell and MPPI finds no
      # feasible rollout ("Optimizer fail to compute path") - measured as 42
      # failures and a wedged fleet in one run. The padding is what restores
      # the margin the old undersized footprint was accidentally providing.
      footprint_padding: 0.02
      always_send_full_costmap: true
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /<robot_name>/scan_fixed
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.35
      transform_tolerance: 0.5

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.125
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: <robot_name>/odom
    global_frame: map
    robot_base_frame: <robot_name>/base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.4

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.55, 0.55, 1.2]   # [vx, vy, wz] - lateral enabled
    min_velocity: [-0.55, -0.55, -1.2]
    max_accel: [0.9, 0.9, 2.4]
    max_decel: [-0.9, -0.9, -2.4]
    odom_topic: /<robot_name>/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: <robot_name>/base_footprint
    odom_frame_id: <robot_name>/odom
    # RELATIVE on purpose - see the note in nav2_params_light.yaml.
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.2
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    polygons: ["PolygonSlow", "PolygonStop"]
    PolygonSlow:
      type: "polygon"
      points: "[[1.00, 0.66], [1.00, -0.66], [-0.32, -0.66], [-0.32, 0.66]]"
      action_type: "slowdown"
      min_points: 3
      slowdown_ratio: 0.4
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
    PolygonStop:
      type: "polygon"
      # Must enclose the real body (half-extents 0.202 x 0.176) or the
      # emergency stop would let something graze the wheels.
      points: "[[0.34, 0.24], [0.34, -0.24], [-0.24, -0.24], [-0.24, 0.24]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop"
    observation_sources: ["robot_obstacles"]
    scan:
      type: "scan"
      topic: /<robot_name>/scan_fixed
    # See the note in nav2_params_light.yaml.
    robot_obstacles:
      type: "scan"
      topic: /<robot_name>/robot_obstacles
