# State Lattice navigation, enlarged fleet (2026-10-14).
# Physical footprint 1.4318181 x 1.125 m; global/local/swept geometry match.
# Control sets: 0.05 m, 64 headings, 0.50 m curve radius, with rotations.
# MPPI follows path orientations; the omni model also permits lateral moves.
# Inflation is a soft cost field outside the actual padded rectangular body.
# The launch file resolves <robot_name>/<bringup_share> and validates the lattice.

# AMCL runs one filter per robot against the shared map. The frame ids MUST be
# namespaced: the TF tree contains <robot_name>/odom and
# <robot_name>/base_footprint, never bare odom / base_footprint. With the bare
# defaults the message filter cannot transform a single scan, drops every one
# of them with "discarding message because the queue is full", and
# /<robot_name>/amcl_pose stays empty forever.
# tf_broadcast stays false: map -> odom is owned by bridge.launch.py, and the
# ground-truth odom relay owns odom -> base_footprint.
amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: <robot_name>/odom
    base_frame_id: <robot_name>/base_footprint
    scan_topic: scan          # remapped to /<robot_name>/scan_fixed by nav2.launch.py
    tf_broadcast: false

bt_navigator:
  ros__parameters:
    use_sim_time: true
    default_nav_to_pose_bt_xml: <bringup_share>/config/fleet_navigation.xml
    global_frame: map
    robot_base_frame: <robot_name>/base_footprint
    odom_topic: /<robot_name>/odom
    bt_loop_duration: 10
    # How long bt_navigator waits for an action server (the planner, the
    # controller, the recovery behaviours) to acknowledge a goal. The Nav2
    # default of 20 ms is measured in wall-clock time and this machine runs
    # Gazebo plus four full Nav2 stacks, where gz sim server alone saturates a
    # core. Under that load the planner occasionally fails to ACK inside 20 ms,
    # bt_navigator aborts navigate_to_pose with status 6, and fleet_manager
    # burns the task's single requeue before marking it FAILED permanently.
    # 300 ms costs nothing when the server is healthy, because the wait ends as
    # soon as the ACK arrives.
    plugin_lib_names: ["hetero_stable_route_bt"]
    default_server_timeout: 2000

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker", "task_goal_checker"]
    controller_plugins: ["FollowPath", "TaskFollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # The collision monitor stops the base when another vehicle is about to
      # touch it. With the stock 10 s allowance that safety stop looked exactly
      # like a stuck robot: the progress checker aborted the goal, NavigateToPose
      # returned ABORTED, and fleet_manager burned the task's single requeue -
      # measured on a full mixed_20 run as t09 and t14 failing with
      # "navigation to pickup failed" right after an omni_1 PolygonStop event.
      # Waiting for traffic to clear is the behaviour we want, so the robot is
      # given 30 s of no progress before it is considered stuck.
      required_movement_radius: 0.2
      movement_time_allowance: 30.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    task_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.141593

    FollowPath: &path_controller
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.0            # differential drive: no lateral motion
      wz_std: 0.4
      vx_max: 0.70           # light AMR top speed (see robot_profiles.yaml)
      vx_min: -0.25
      vy_max: 0.0
      wz_max: 1.5
      iteration_count: 1
      prune_distance: 1.2
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic: &goal_angle
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 0.75
        critical_weight: 10.0
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.05
        near_goal_distance: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.15
        offset_from_furthest: 4
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 2

    TaskFollowPath:
      <<: *path_controller
      GoalAngleCritic:
        <<: *goal_angle
        enabled: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      always_send_full_costmap: true
      global_frame: <robot_name>/odom
      robot_base_frame: <robot_name>/base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Physical rectangular footprint, equal to the scaled collision body.
      footprint: '[[0.71590905, 0.5625], [0.71590905, -0.5625], [-0.71590905, -0.5625], [-0.71590905, 0.5625]]'
      # 3 cm of padding on top of the true outline. Without it the costmap's
      # lethal radius equals the physical contact distance, so a robot that
      # brushes a wall sits inside its own lethal cell and MPPI finds no
      # feasible rollout ("Optimizer fail to compute path") - measured as 42
      # failures and a wedged fleet in one run. The padding is what restores
      # the margin the old undersized footprint was accidentally providing.
      footprint_padding: 0.03
      plugins: ["static_layer", "obstacle_layer", "robot_obstacle_layer", "inflation_layer"]
      # Keep mapped walls visible to MPPI even without a physical lidar return.
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /<robot_name>/map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        footprint_clearing_enabled: false
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /<robot_name>/scan_fixed
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
        # Where the OTHER vehicles are, synthesised by scan_frame_relay.py from
        # their odometry - the lidars sit at different heights and cannot see
        # each other (see that script). This source is LOCAL ONLY: the global
        # costmap below deliberately listens to scan_fixed alone, because a
        # parked vehicle in the planning grid makes a shared pickup zone
        # unreachable ("no valid path found" for a 1.5 m move) and costs the
        # task its single requeue.
      robot_obstacle_layer:
        plugin: "hetero_fleet_navigation::SnapshotObstacleLayer"
        enabled: true
        combination_method: 1
        observation_sources: robot_obstacles
        robot_obstacles:
          topic: /<robot_name>/robot_planning_points
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          inf_is_valid: true
          observation_persistence: 0.0
          data_type: "PointCloud2"
          raytrace_max_range: 50.0
          raytrace_min_range: 0.0
          obstacle_max_range: 50.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.20
      always_reset_initial_costmap: false
      # The local rolling window must NOT use unknown space. MPPI's obstacle
      # critic treats NO_INFORMATION (255) as a blocking cell, so any part of
      # the 4x4 m window the lidar has not cleared yet becomes a wall the robot
      # refuses to drive into: it ends up boxed in and creeps at a few cm/s
      # until the progress checker aborts the goal. The lidar covers the whole
      # window (12 m range, 360 deg), so unobserved cells are free for planning
      # purposes here. The global costmap keeps track_unknown_space: true - it
      # is covered by the static map, which is fully known.
      track_unknown_space: false
      transform_tolerance: 0.5

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      always_send_full_costmap: true
      global_frame: map
      robot_base_frame: <robot_name>/base_footprint
      footprint: '[[0.71590905, 0.5625], [0.71590905, -0.5625], [-0.71590905, -0.5625], [-0.71590905, 0.5625]]'
      # Same physical body as the local costmap and State Lattice sweep.
      # Local control uses this vehicle\'s measured body and smaller padding.
      footprint_padding: 0.03 # Match the physical swept body.
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "robot_obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /<robot_name>/scan_fixed
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      robot_obstacle_layer:
        plugin: "hetero_fleet_navigation::SnapshotObstacleLayer"
        enabled: true
        combination_method: 1
        observation_sources: robot_obstacles
        robot_obstacles:
          topic: /<robot_name>/robot_planning_points
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          inf_is_valid: true
          observation_persistence: 0.0
          data_type: "PointCloud2"
          raytrace_max_range: 50.0
          raytrace_min_range: 0.0
          obstacle_max_range: 50.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.5
        inflation_radius: 1.20
      transform_tolerance: 0.5

planner_server:
  ros__parameters:
    use_sim_time: true
    # Expected computation cadence only; the BT controls replanning triggers.
    expected_planner_frequency: 0.5
    planner_plugins: ["GridBased", "TaskGridBased", "RetreatGridBased"]
    GridBased: &spatial_planner
      plugin: hetero_fleet_navigation::SweptLattice
      lattice_filepath: <bringup_share>/config/lattice/diff_64.json
      allow_reverse_expansion: true
      swept_footprint: '[[0.71590905, 0.5625], [0.71590905, -0.5625], [-0.71590905, -0.5625], [-0.71590905, 0.5625]]'
      swept_footprint_padding: 0.03
      rotation_penalty: 2.0
      heuristic_weight: 1.5
      tolerance: 0.05
      allow_unknown: false
      max_iterations: 1000000
      max_planning_time: 8.0
      reverse_penalty: 2.0
      cost_penalty: 2.0

    TaskGridBased:
      <<: *spatial_planner
      match_goal_heading: false
    RetreatGridBased:
      <<: *spatial_planner
      match_goal_heading: true
      reverse_penalty: 1.0


smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: <robot_name>/odom
    global_frame: map
    robot_base_frame: <robot_name>/base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.4

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.70, 0.0, 1.5]    # [vx, vy, wz] - no lateral for diff drive
    min_velocity: [-0.25, 0.0, -1.5]
    max_accel: [1.0, 0.0, 3.0]
    max_decel: [-1.0, 0.0, -3.0]
    odom_topic: /<robot_name>/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# No proximity slowdown. Emergency contact stop remains authoritative.
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: <robot_name>/base_footprint
    odom_frame_id: <robot_name>/odom
    cmd_vel_in_topic: cmd_vel_reserved
    cmd_vel_out_topic: cmd_vel
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 2.0
    polygons:
    - PolygonStop
    PolygonStop:
      type: velocity_polygon
      action_type: stop
      min_points: 2
      visualize: true
      polygon_pub_topic: polygon_stop
      holonomic: false
      velocity_polygons:
      - forward
      - reverse
      - turning
      forward:
        points: '[[0.8359086, 0.6125], [0.8359086, -0.6125], [0.0, -0.6125], [0.0, 0.6125]]'
        linear_min: 0.02
        linear_max: 2.0
        theta_min: -0.1
        theta_max: 0.1
      reverse:
        points: '[[0.0, 0.6125], [0.0, -0.6125], [-0.8359086, -0.6125], [-0.8359086, 0.6125]]'
        linear_min: -2.0
        linear_max: -0.02
        theta_min: -0.1
        theta_max: 0.1
      turning:
        points: '[[0.7459086, 0.5925], [0.7459086, -0.5925], [-0.7459086, -0.5925], [-0.7459086, 0.5925]]'
        linear_min: -2.0
        linear_max: 2.0
        theta_min: -100.0
        theta_max: 100.0
    observation_sources:
    - robot_obstacles
    robot_obstacles:
      type: scan
      topic: /<robot_name>/robot_contact
