# Wheel geometry matches the URDF after the 10% uniform size reduction.
/<robot_name>/controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

/<robot_name>/joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

/<robot_name>/mecanum_drive_controller:
  ros__parameters:
    use_sim_time: true
    front_left_wheel_command_joint_name:  "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_left_wheel_command_joint_name:   "rear_left_wheel_joint"
    rear_right_wheel_command_joint_name:  "rear_right_wheel_joint"

    front_left_wheel_state_joint_name:  "front_left_wheel_joint"
    front_right_wheel_state_joint_name: "front_right_wheel_joint"
    rear_left_wheel_state_joint_name:   "rear_left_wheel_joint"
    rear_right_wheel_state_joint_name:  "rear_right_wheel_joint"

    kinematics:
      wheels_radius: 0.127232142840
      sum_of_robot_center_projection_on_X_Y_axis: 0.984375000000

    # Frames already carry the robot namespace in this rendered file.
    tf_frame_prefix_enable: false
    reference_timeout: 0.5

    publish_rate: 50.0
    odom_frame_id: <robot_name>/odom
    base_frame_id: <robot_name>/base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # This controller version has no open-loop odometry mode. The bringup
    # package derives omni odometry from the bridged Gazebo model pose.
    enable_odom_tf: false

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.55
        min_velocity: -0.55
        has_acceleration_limits: true
        max_acceleration: 0.5
        min_acceleration: -0.7
      y:
        has_velocity_limits: true
        max_velocity: 0.55
        min_velocity: -0.55
        has_acceleration_limits: true
        max_acceleration: 0.5
        min_acceleration: -0.7
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.2
        min_velocity: -1.2
        has_acceleration_limits: true
        max_acceleration: 1.4
        min_acceleration: -1.4
