# Wheel geometry matches the URDF after the 10% uniform size reduction.
/<robot_name>/controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

/<robot_name>/joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

/<robot_name>/diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names:  ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 1.022727272760
    wheel_radius: 0.187499999970

    publish_rate: 50.0
    # Frame ids below already include the rendered robot namespace.
    tf_frame_prefix_enable: false
    odom_frame_id: <robot_name>/odom
    base_frame_id: <robot_name>/base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # Gazebo Harmonic's joint state feedback can lag or remain at zero even
    # while velocity commands move the simulated model. Integrate commanded
    # velocity so odom and RViz stay aligned with the moving entity.
    open_loop: true
    # ...but DO NOT publish the odom -> base_footprint transform from here.
    # Open-loop integration drifts the moment the robot is blocked or slips,
    # and Nav2 then projects its laser scans through that wrong pose: phantom
    # obstacles appear in the costmap and the planner ends up reporting
    # "no valid path found" while the robot sits in a perfectly open aisle.
    # The bridge launch runs one ground-truth odom relay per robot, which owns
    # this transform (and /<robot>/odom) instead.
    enable_odom_tf: false

    cmd_vel_timeout: 0.5

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.70
        min_velocity: -0.25
        has_acceleration_limits: true
        max_acceleration: 1.0
        min_acceleration: -1.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.5
        min_velocity: -1.5
        has_acceleration_limits: true
        max_acceleration: 3.0
        min_acceleration: -3.0
