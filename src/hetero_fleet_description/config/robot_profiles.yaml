# Current fleet: light, heavy, omni and G1 biped (2026-10-10).
# Wheels reduced uniformly by 10%; footprints cover collision shapes, padding mirrors Nav2.
# Each robot has its own charger at its spawn pose, preserving odom anchors.
fleet:
  - name: light_1
    type: light_diff_amr
    # Centre the westbound reverse segment above the southwest wall protrusion.
    charger: [-0.30, -0.25, 0.0]
    spawn:   [-0.30, -0.25, 0.0]
    charger_exit: [-0.10, -0.25, 0.0]
    idle_clearance: [-7.00, -0.25, 0.0]
    startup_clearance: true
  - name: heavy_1
    type: heavy_diff_amr
    charger: [2.70, -0.45, 0.0]     # charger_C; keep spawn and odometry anchor in sync.
    spawn:   [2.70, -0.45, 0.0]
    charger_exit: [2.90, -0.45, 0.0]
  - name: omni_1
    type: omni_mecanum_amr
    charger: [4.60, -0.45, 0.0]     # charger_D, east end of the row
    spawn:   [4.60, -0.45, 0.0]
    idle_clearance: [-4.80, -0.25, 0.0]
    charger_exit: [4.60, -0.25, 0.0] # Strafe out without an unnecessary 90-degree turn.

  - name: g1_1
    type: g1_humanoid
    charger: [1.20, -0.80, 0.0]   # restored charger_B
    spawn: [1.20, -0.80, 0.0]
    # Keep the full turning envelope south of the rack corners.
    charger_exit: [1.20, -0.20, 0.0]
    charger_route: [[3.8, -0.2, 3.14159265359], [1.2, -0.2, 0.0]]
    # Outside the wheel routes: clear the dropoff if the next pickup is busy.
    idle_clearance: [1.20, -1.00, 0.0]
    spawn_z: 0.127               # 1 cm above the z=0.117 physical floor

robot_types:

  light_diff_amr:
    description: "Light differential-drive AMR for narrow aisles"
    kinematics: diff            # diff | mecanum
    urdf: light_diff_amr.xacro
    controllers: light_diff_amr_controllers.yaml

    max_speed: 0.70             # m/s
    max_accel: 1.0              # m/s^2
    max_omega: 1.5              # rad/s
    payload_kg: 20.0
    footprint_padding: 0.03
    planning_footprint: [1.4318181, 1.125] # State Lattice and path validation use the actual body.
    planner_footprint_padding: 0.03 # Same body as the local costmap.
    footprint: [1.4318181, 1.125]   # length x width, metres (true collision outline)
    # Mirrors the costmap inflation in hetero_fleet_bringup/config/
    # nav2_params_light.yaml - keep the two numbers equal. tools/pick_zones.py
    # uses this to decide which floor cells the robot can plan through.
    inflation_radius: 1.20      # mirrors nav2_params_light.yaml
    battery_capacity_wh: 480.0

    capabilities: [light_payload, narrow_aisle]

    # Used by the scheduler's energy model: Wh consumed per metre travelled,
    # roughly linear in (mass + payload).
    wh_per_meter_empty: 0.85
    wh_per_meter_kg: 0.012      # additional Wh/m per kg of payload

  heavy_diff_amr:
    description: "Heavy differential-drive AMR for pallet transport"
    kinematics: diff
    urdf: heavy_diff_amr.xacro
    controllers: heavy_diff_amr_controllers.yaml

    max_speed: 0.45
    max_accel: 0.5
    max_omega: 0.8
    payload_kg: 150.0
    footprint_padding: 0.03
    planning_footprint: [1.4927886, 1.125] # State Lattice and path validation use the actual body.
    planner_footprint_padding: 0.03 # Same body as the local costmap.
    footprint: [1.4927886, 1.125]
    inflation_radius: 1.20      # mirrors nav2_params_heavy.yaml
    battery_capacity_wh: 1200.0

    capabilities: [heavy_payload]

    wh_per_meter_empty: 1.80
    wh_per_meter_kg: 0.020

  omni_mecanum_amr:
    description: "Mecanum AMR for precise lateral docking"
    kinematics: mecanum
    urdf: omni_mecanum_amr.xacro
    controllers: omni_mecanum_amr_controllers.yaml

    max_speed: 0.55
    max_accel: 0.5
    max_omega: 1.2
    # Kept at 90 kg so this platform can share heavy_1's work on the mixed
    # scenario. Note this does NOT unlock the tasks that *declare*
    # required_capability: heavy_payload - those are gated by the capability
    # list below, not by payload.
    payload_kg: 90.0
    footprint_padding: 0.02
    planning_footprint: [1.2857139, 1.125] # State Lattice and path validation use the actual body.
    planner_footprint_padding: 0.02 # Same body as the local costmap.
    footprint: [1.2857139, 1.125]
    inflation_radius: 1.20      # mirrors nav2_params_omni.yaml
    battery_capacity_wh: 640.0

    capabilities: [precise_docking, omnidirectional]

    wh_per_meter_empty: 1.10
    wh_per_meter_kg: 0.015

  # G1 scale 0.90; twelve physical leg actuators, fixed upper-body training pose.
  g1_humanoid:
    description: G1 biped humanoid with physical leg torque control and native Unitree
      LSTM policy
    kinematics: legged
    urdf: g1_humanoid.xacro
    controllers: ''
    max_speed: 0.3
    max_accel: 0.35
    max_omega: 0.45
    payload_kg: 5.0
    footprint_padding: 0.15
    footprint:
    - 0.6
    - 0.52
    inflation_radius: 0.8
    battery_capacity_wh: 180.0
    capabilities:
    - humanoid_transport
    - manual_handling
    wh_per_meter_empty: 2.0
    wh_per_meter_kg: 0.04

# --- scheduler tuning ----------------------------------------------------
# Kept next to the robot data because the cost function's weights only make
# sense relative to these speeds and energies.
scheduler:
  # The charging forecourt cannot support opposing wheel traffic. Finish a
  # platform's queued jobs, physically park it, then admit the next platform.
  # G1 remains independent. The collection window groups an incoming task batch.
  wheel_dispatch_order: [light_1, omni_1, heavy_1]
  wheel_batch_collect_sec: 60.0
  wheel_yield_to_g1: true
  # cost = w_travel * travel_time
  #      + w_energy * energy
  #      + w_queue  * estimated_wait
  #      + w_capability_penalty (if the robot cannot do the task)
  #      + w_late   * expected_lateness
  weights:
    # travel_time dominates on purpose: it leans on "give the task to
    # whichever eligible robot is already closest", which is what keeps the
    # deadhead running (and therefore the makespan) down. energy is not zero
    # because it is what keeps the light AMR ahead of the heavy one for small
    # capability-free parcels (0.85 Wh/m against 1.80).
    #
    # NOTE: queue_wait has no effect in this design. Only IDLE robots are ever
    # offered work, so a candidate's busy_until is always "now" and that term
    # is always ~0. Making it meaningful would mean letting the scheduler queue
    # onto a busy robot - a code change in cost.py, not a weight change.
    travel_time: 1.5
    energy: 0.02
    queue_wait: 0.30
    capability_mismatch: 1000.0   # effectively a hard constraint
    lateness: 2.0
  # Battery floor: a robot below this will not be offered a new task.
  min_battery_pct: 15.0
  # Simulated handling time at pickup / dropoff, seconds.
  load_time_sec: 3.0
  unload_time_sec: 3.0
