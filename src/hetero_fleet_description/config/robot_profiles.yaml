# Current fleet: one light, one heavy, one omni (2026-10-10).
# Footprints are measured from collision shapes; padding mirrors Nav2.
# Each robot has its own charger at its spawn pose, preserving odom anchors.
fleet:
  - name: light_1
    type: light_diff_amr
    charger: [-0.30, -0.75, 0.0]    # charger_A, west end of the row
    spawn:   [-0.30, -0.75, 0.0]
  - name: heavy_1
    type: heavy_diff_amr
    charger: [2.70, -0.85, 0.0]     # charger_C
    spawn:   [2.70, -0.85, 0.0]
  - name: omni_1
    type: omni_mecanum_amr
    charger: [4.20, -0.85, 0.0]     # charger_D, east end of the row
    spawn:   [4.20, -0.85, 0.0]

robot_types:

  light_diff_amr:
    description: "Light differential-drive AMR for narrow aisles"
    kinematics: diff            # diff | mecanum
    urdf: light_diff_amr.xacro
    controllers: light_diff_amr_controllers.yaml

    max_speed: 0.70             # m/s
    max_accel: 1.0              # m/s^2
    max_omega: 1.5              # rad/s
    payload_kg: 20.0
    footprint_padding: 0.06
    footprint: [0.6888, 0.5412]   # length x width, metres (true collision outline)
    # Mirrors the costmap inflation in hetero_fleet_bringup/config/
    # nav2_params_light.yaml - keep the two numbers equal. tools/pick_zones.py
    # uses this to decide which floor cells the robot can plan through.
    inflation_radius: 0.60      # mirrors nav2_params_light.yaml
    battery_capacity_wh: 480.0

    capabilities: [light_payload, narrow_aisle]

    # Used by the scheduler's energy model: Wh consumed per metre travelled,
    # roughly linear in (mass + payload).
    wh_per_meter_empty: 0.85
    wh_per_meter_kg: 0.012      # additional Wh/m per kg of payload

  heavy_diff_amr:
    description: "Heavy differential-drive AMR for pallet transport"
    kinematics: diff
    urdf: heavy_diff_amr.xacro
    controllers: heavy_diff_amr_controllers.yaml

    max_speed: 0.45
    max_accel: 0.5
    max_omega: 0.8
    payload_kg: 150.0
    footprint_padding: 0.03
    footprint: [0.8556, 0.6448]
    inflation_radius: 0.60      # mirrors nav2_params_heavy.yaml
    battery_capacity_wh: 1200.0

    capabilities: [heavy_payload]

    wh_per_meter_empty: 1.80
    wh_per_meter_kg: 0.020

  omni_mecanum_amr:
    description: "Mecanum AMR for precise lateral docking"
    kinematics: mecanum
    urdf: omni_mecanum_amr.xacro
    controllers: omni_mecanum_amr_controllers.yaml

    max_speed: 0.55
    max_accel: 0.5
    max_omega: 1.2
    # Kept at 90 kg so this platform can share heavy_1's work on the mixed
    # scenario. Note this does NOT unlock the tasks that *declare*
    # required_capability: heavy_payload - those are gated by the capability
    # list below, not by payload.
    payload_kg: 90.0
    footprint_padding: 0.02
    footprint: [0.672, 0.588]
    inflation_radius: 0.60      # mirrors nav2_params_omni.yaml
    battery_capacity_wh: 640.0

    capabilities: [precise_docking, omnidirectional]

    wh_per_meter_empty: 1.10
    wh_per_meter_kg: 0.015

# --- scheduler tuning ----------------------------------------------------
# Kept next to the robot data because the cost function's weights only make
# sense relative to these speeds and energies.
scheduler:
  # cost = w_travel * travel_time
  #      + w_energy * energy
  #      + w_queue  * estimated_wait
  #      + w_capability_penalty (if the robot cannot do the task)
  #      + w_late   * expected_lateness
  weights:
    # travel_time dominates on purpose: it leans on "give the task to
    # whichever eligible robot is already closest", which is what keeps the
    # deadhead running (and therefore the makespan) down. energy is not zero
    # because it is what keeps the light AMR ahead of the heavy one for small
    # capability-free parcels (0.85 Wh/m against 1.80).
    #
    # NOTE: queue_wait has no effect in this design. Only IDLE robots are ever
    # offered work, so a candidate's busy_until is always "now" and that term
    # is always ~0. Making it meaningful would mean letting the scheduler queue
    # onto a busy robot - a code change in cost.py, not a weight change.
    travel_time: 1.5
    energy: 0.02
    queue_wait: 0.30
    capability_mismatch: 1000.0   # effectively a hard constraint
    lateness: 2.0
  # Battery floor: a robot below this will not be offered a new task.
  min_battery_pct: 15.0
  # Simulated handling time at pickup / dropoff, seconds.
  load_time_sec: 5.0
  unload_time_sec: 5.0
