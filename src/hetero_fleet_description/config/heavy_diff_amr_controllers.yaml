# Wheel geometry matches the URDF after the 10% uniform size reduction.
/<robot_name>/controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

/<robot_name>/joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

/<robot_name>/diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names:  ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 1.027644230790
    wheel_radius: 0.216346153860

    publish_rate: 50.0
    # Frame ids below already include the rendered robot namespace.
    tf_frame_prefix_enable: false
    odom_frame_id: <robot_name>/odom
    base_frame_id: <robot_name>/base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # Use commanded velocity for simulation odometry; Gazebo joint feedback
    # is not reliable enough to drive closed-loop odometry in this setup.
    open_loop: true
    # The odom -> base_footprint transform is published by the ground-truth
    # odom relay started in bridge.launch.py, not by this controller: open-loop
    # odometry drifts whenever a robot is blocked, and Nav2 then marks phantom
    # obstacles wherever the laser is projected through the stale pose.
    enable_odom_tf: false

    cmd_vel_timeout: 0.5

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.45
        min_velocity: -0.20
        has_acceleration_limits: true
        max_acceleration: 0.5
        min_acceleration: -0.5
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 0.8
        min_velocity: -0.8
        has_acceleration_limits: true
        max_acceleration: 1.2
        min_acceleration: -1.2
